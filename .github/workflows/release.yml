name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [[ "$latest" =~ ^v2\.0\.([0-9]+)$ ]]; then
            number="${BASH_REMATCH[1]}"
            number=$((number + 1))
            version="v2.0.$number"
          else
          version="v3.0.0"
          fi

          rpm_version="${version#v}"

          echo "Latest Release: ${latest:-none}"
          echo "GitHub Release: $version"
          echo "RPM Version: $rpm_version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rpm_version=$rpm_version" >> "$GITHUB_OUTPUT"

      - name: Build PostgreSQL CIS Scanner
        run: |
          go build -o pgcis ./cmd/pgcis

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Prepare RPM sources
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cp pgcis ~/rpmbuild/SOURCES/pgcis
          cp configs/servers.json ~/rpmbuild/SOURCES/servers.json
          cp configs/README.txt ~/rpmbuild/SOURCES/README.txt
          cp configs/templates/iaas.json ~/rpmbuild/SOURCES/iaas.json
          cp configs/templates/pass.json ~/rpmbuild/SOURCES/pass.json
          cp -r benchmark ~/rpmbuild/SOURCES/benchmark
          cp packaging/pgcis.spec ~/rpmbuild/SPECS/pgcis.spec
          cp -r templates ~/rpmbuild/SOURCES/templates

          echo "=== Repository templates ==="
          find templates -maxdepth 2 -type f -print

          echo "=== RPM source templates ==="
          find ~/rpmbuild/SOURCES/templates -maxdepth 2 -type f -print

      - name: Set RPM version
        run: |
          sed -i "s/^Version:.*/Version:        ${{ steps.version.outputs.rpm_version }}/" \
            ~/rpmbuild/SPECS/pgcis.spec

          echo "RPM spec version:"
          grep '^Version:' ~/rpmbuild/SPECS/pgcis.spec

      - name: Build RPM
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/pgcis.spec

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RPM=$(find ~/rpmbuild/RPMS -name '*.rpm' | head -1)

          echo "RPM: $RPM"

          gh release create "${{ steps.version.outputs.version }}" \
            ./pgcis \
            "$RPM" \
            --title "PGCIS ${{ steps.version.outputs.version }}" \
            --generate-notes

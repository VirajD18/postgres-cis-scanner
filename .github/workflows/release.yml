name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v3\.0\.[0-9]+$' \
            | sort -V \
            | tail -1)

          if [ -z "$latest" ]; then
            version="v3.0.0"
          else
            number=$(echo "$latest" | sed 's/^v3\.0\.//')
            number=$((number + 1))
            version="v3.0.$number"
          fi

          rpm_version="${version#v}"

          echo "Latest Release: ${latest:-none}"
          echo "GitHub Release: $version"
          echo "RPM Version: $rpm_version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rpm_version=$rpm_version" >> "$GITHUB_OUTPUT"

      - name: Build PostgreSQL CIS Scanner
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o pgcis ./cmd/pgcis

      - name: Prepare RPM sources
        run: |
          rm -rf dist
          mkdir -p dist/el8 dist/el9

          mkdir -p rpm-sources

          cp pgcis rpm-sources/pgcis
          cp configs/servers.json rpm-sources/servers.json
          cp configs/README.txt rpm-sources/README.txt
          cp configs/templates/iaas.json rpm-sources/iaas.json
          cp configs/templates/pass.json rpm-sources/pass.json

          cp -r benchmark rpm-sources/benchmark
          cp -r templates rpm-sources/templates
          cp packaging/pgcis.spec rpm-sources/pgcis.spec

      - name: Build EL8 RPM
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:8 \
            bash -c '
              set -e

              dnf install -y rpm-build rpmdevtools findutils

              mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

              cp rpm-sources/pgcis /root/rpmbuild/SOURCES/pgcis
              cp rpm-sources/servers.json /root/rpmbuild/SOURCES/servers.json
              cp rpm-sources/README.txt /root/rpmbuild/SOURCES/README.txt
              cp rpm-sources/iaas.json /root/rpmbuild/SOURCES/iaas.json
              cp rpm-sources/pass.json /root/rpmbuild/SOURCES/pass.json

              cp -r rpm-sources/benchmark /root/rpmbuild/SOURCES/benchmark
              cp -r rpm-sources/templates /root/rpmbuild/SOURCES/templates

              cp rpm-sources/pgcis.spec /root/rpmbuild/SPECS/pgcis.spec

              sed -i "s/^Version:.*/Version:        ${{ steps.version.outputs.rpm_version }}/" \
                /root/rpmbuild/SPECS/pgcis.spec

              rpmbuild -ba /root/rpmbuild/SPECS/pgcis.spec

              cp /root/rpmbuild/RPMS/x86_64/*.rpm /workspace/dist/el8/
            '

          echo "EL8 RPM:"
          find dist/el8 -type f -name "*.rpm"

      - name: Build EL9 RPM
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:9 \
            bash -c '
              set -e

              dnf install -y rpm-build rpmdevtools findutils

              mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

              cp rpm-sources/pgcis /root/rpmbuild/SOURCES/pgcis
              cp rpm-sources/servers.json /root/rpmbuild/SOURCES/servers.json
              cp rpm-sources/README.txt /root/rpmbuild/SOURCES/README.txt
              cp rpm-sources/iaas.json /root/rpmbuild/SOURCES/iaas.json
              cp rpm-sources/pass.json /root/rpmbuild/SOURCES/pass.json

              cp -r rpm-sources/benchmark /root/rpmbuild/SOURCES/benchmark
              cp -r rpm-sources/templates /root/rpmbuild/SOURCES/templates

              cp rpm-sources/pgcis.spec /root/rpmbuild/SPECS/pgcis.spec

              sed -i "s/^Version:.*/Version:        ${{ steps.version.outputs.rpm_version }}/" \
                /root/rpmbuild/SPECS/pgcis.spec

              rpmbuild -ba /root/rpmbuild/SPECS/pgcis.spec

              cp /root/rpmbuild/RPMS/x86_64/*.rpm /workspace/dist/el9/
            '

          echo "EL9 RPM:"
          find dist/el9 -type f -name "*.rpm"

      - name: Show RPMs
        run: |
          echo "=============================="
          echo "EL8 RPM"
          echo "=============================="
          find dist/el8 -type f -name "*.rpm"

          echo "=============================="
          echo "EL9 RPM"
          echo "=============================="
          find dist/el9 -type f -name "*.rpm"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RPM8=$(find dist/el8 -name '*.rpm' | head -1)
          RPM9=$(find dist/el9 -name '*.rpm' | head -1)

          echo "RPM EL8: $RPM8"
          echo "RPM EL9: $RPM9"

          gh release create "${{ steps.version.outputs.version }}" \
            ./pgcis \
            "$RPM8" \
            "$RPM9" \
            --title "PGCIS ${{ steps.version.outputs.version }}" \
            --generate-notes
